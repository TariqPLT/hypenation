kind = "web"
previewPath = "/"
title = "Hypenation Media"
version = "1.0.0"
id = "artifacts/hypenation"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23556

[services.development]
run = "pnpm --filter @workspace/hypenation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hypenation", "run", "build" ]
publicDir = "artifacts/hypenation/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23556"
BASE_PATH = "/"
